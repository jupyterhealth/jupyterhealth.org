[workspace]
name = "jupyterhealth-website"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
# Keep in sync with HUGO_VERSION in .github/workflows/
hugo = "==0.162.1"

[tasks]
"docs:live" = "hugo server --baseURL http://localhost/"
"docs:build" = "hugo --gc --minify"
