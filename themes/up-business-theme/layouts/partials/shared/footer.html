<footer class="jh-footer">
  <div class="container">
    <div class="jh-footer-top">
      <div class="jh-footer-brand">
        <a href="{{ .Site.BaseURL }}" class="jh-footer-logo-link">
          <img src="{{ "images/JH_logo_2.png" | relURL }}" alt="JupyterHealth" class="jh-footer-logo" />
        </a>
        <p class="jh-footer-blurb">
          Open software platform for health data ingestion, management, and analysis. Built on the Jupyter ecosystem.
        </p>
      </div>
      <div class="jh-footer-links">
        <a class="jh-footer-link" href="https://docs.jupyterhealth.org/" target="_blank" rel="noreferrer">
          {{ partial "icons/book.html" }}<span>Docs</span>
        </a>
        <a class="jh-footer-link" href="https://github.com/jupyterhealth" target="_blank" rel="noreferrer">
          {{ partial "icons/github.html" }}<span>GitHub</span>
        </a>
        <a class="jh-footer-link" href="https://www.linkedin.com/company/jupyterhealth/about/" target="_blank" rel="noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <rect width="16" height="16" rx="2" fill="#888888" />
            <text x="8" y="12" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">in</text>
          </svg>
          <span>LinkedIn</span>
        </a>
      </div>
    </div>
    <div class="jh-footer-bottom">
      <p class="jh-footer-copy">© {{ now.Year }} Project Jupyter. All rights reserved.</p>
    </div>
  </div>
</footer>
